[package]
name = "hermion-sidecar"
version = "0.1.0"
edition = "2021"
description = "Moonshine ONNX inference sidecar for Hermion"

[[bin]]
name = "hermion-sidecar"
path = "src/main.rs"

[dependencies]
# ort will be enabled once ONNX models are downloaded
# ort = { version = "2.0.0-rc.13", features = ["load-dynamic"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
log = "0.4"
env_logger = "0.11"
anyhow = "1"
